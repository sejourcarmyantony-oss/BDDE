services:
  - type: web
    name: shadow-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: OWNER_PHONE
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: IMAGE_API_KEY
        sync: false
      - key: AUDD_API_KEY
        sync: false
        
